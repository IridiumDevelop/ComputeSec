name: Build

on:
  push:
    paths:
      - 'computesec/**'
      - 'run.py'
      - 'tests/**'
      - 'data/**'
      - 'web/**'
      - 'scripts/**'
      - 'pyproject.toml'          # ruff 规则集与 fail_under 都在里面
      - 'conftest.py'             # 决定 sys.path，删掉 test_run.py 就 import 失败
      - '*.json'
      - '*.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'computesec/**'
      - 'run.py'
      - 'tests/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'conftest.py'
  workflow_dispatch:

# 默认只读：lint / smoke 不需要写权限。只有 release 作业单独提权到 write，
# 避免一个被篡改的测试脚本顺手就能改仓库内容。
permissions:
  contents: read

# 连续 push 时取消上一轮：release 作业是"先删 nightly 再重建"，两个 run 同时
# 执行会互相踩，甚至让 nightly 指向错误的 commit。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python ${{ matrix.python-version }}：语法、lint、测试与元数据检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # README 承诺 Python ≥ 3.9；只在 3.12 上跑，写进 README 的下限就没人验证。
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 编译检查
        run: python -m compileall -q computesec run.py scripts
      - name: 安装检查工具
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
      - name: Lint（规则见 pyproject.toml，与本地保持一致）
        run: ruff check .
      - name: 运行单元测试与覆盖率门槛
        run: python -m pytest -q --cov=computesec --cov=run
      - name: 安装元数据校验工具
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream libxml2-utils
      - name: 校验 web/ 的字体子集是否与页面一致
        run: python scripts/subset_font.py --check
      - name: 校验 .desktop / metainfo / SVG（有错误即失败）
        run: |
          desktop-file-validate data/uk._92li.lingyicute.ComputeSec.desktop
          appstreamcli validate --no-net data/uk._92li.lingyicute.ComputeSec.metainfo.xml
          xmllint --noout data/icons/hicolor/scalable/apps/uk._92li.lingyicute.ComputeSec.svg

  smoke:
    name: UI 冒烟测试（Xvfb，真跑一遍 GTK）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统 Python 的 PyGObject / GTK4 / libadwaita 与 Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pytest \
            gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: 在虚拟显示上构建五个页面并呈现一次版本线弹窗
        run: xvfb-run -a /usr/bin/python3 -m pytest tests/test_ui_smoke.py -q

  flatpak:
    name: 构建 Flatpak (${{ matrix.arch }})
    # PR 只跑 lint + smoke（几十秒），不跑两个架构的整包构建（各要几十分钟）；
    # 需要验证 manifest 时由维护者手动 workflow_dispatch 或在 push 后看结果。
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: 构建并导出 bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ComputeSec-${{ matrix.arch }}.flatpak
          manifest-path: uk._92li.lingyicute.ComputeSec.json
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
          upload-artifact: true

  release:
    name: 发布 Nightly
    if: github.ref == 'refs/heads/main'
    needs: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # gh release delete / create 需要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 删除旧 nightly 并重建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly artifacts/**/*.flatpak \
            --target "${{ github.sha }}" \
            --title "Nightly Build" \
            --prerelease \
            --notes "Nightly 自动构建：Run #${{ github.run_number }}，commit ${{ github.sha }}"

